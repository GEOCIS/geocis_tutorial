format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    filters:
      - readme-links.lua
    toc: true
    toc-title: "Nesta página"
    toc-depth: 3
    number-sections: false
    code-copy: true
    code-overflow: wrap
    anchor-sections: true
    lightbox: auto
    smooth-scroll: true
    link-external-newwindow: true
    # Segurança: o GitHub Pages não permite cabeçalhos HTTP próprios, então as regras vão em <meta>.
    # O site só carrega arquivos dele mesmo (e as fontes do Google usadas pelo tema);
    # 'unsafe-inline' é exigido pelos scripts embutidos do Quarto.
    # Faixa com o banner do GeoCiS logo abaixo do menu, em todas as páginas
    include-after-body:
      text: |
        <script>
          (function () {
            var logo = document.querySelector('.navbar-logo');
            var topo = document.getElementById('quarto-header');
            if (!logo || !topo) return;
            var faixa = document.createElement('div');
            faixa.className = 'faixa-geocis';
            faixa.innerHTML = '<a href="https://esalqgeocis.wixsite.com/geocis"><img alt="GeoCiS, Grupo de Geotecnologias em Ciência do Solo, ESALQ/USP"></a>';
            faixa.querySelector('img').src = logo.src.replace('geocis_logo.png', 'geocis_capa.png');
            topo.after(faixa);

            // Migalhas começam pelo ícone de casa, como "⌂ › Curso › Aula"
            var migalhas = document.querySelector('.quarto-title-breadcrumbs .breadcrumb');
            var inicio = document.querySelector('.navbar-brand');
            if (migalhas && inicio) {
              var casa = document.createElement('li');
              casa.className = 'breadcrumb-item';
              casa.innerHTML = '<a aria-label="Início"><i class="bi bi-house"></i></a>';
              casa.querySelector('a').href = inicio.href;
              migalhas.prepend(casa);
            }
          })();
        </script>
    include-in-header:
      text: |
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests">
        <meta name="referrer" content="strict-origin-when-cross-origin">
